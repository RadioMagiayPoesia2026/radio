<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Magia y Poesía - Programación, Clima y Noticias</title>
    <!-- Importar tipografía moderna y geométrica (Montserrat) desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="https://extassisnetwork.com/player/Luna/largo.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* FONDO COLORIDO, VIBRANTE Y MODERNO (CYBERPUNK NEÓN) */
        body { 
            background: radial-gradient(circle at 15% 15%, #4a0e4e 0%, transparent 40%),
                        radial-gradient(circle at 85% 85%, #0c2042 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, #20093b 0%, #0d0617 100%);
            background-attachment: fixed;
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 30px 10px 120px 10px; 
            overflow-x: hidden; 
        }
        
        /* TÍTULO PRINCIPAL MODERNO, GIGANTE Y ARRIBA DE TODO */
        .radio-main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 20%, #ff2a6d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            letter-spacing: -1px;
            text-transform: uppercase;
            text-shadow: 0 15px 35px rgba(255, 42, 109, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
            width: 100%;
            line-height: 1.1;
        }
        .radio-main-title span {
            font-size: 2rem;
            -webkit-text-fill-color: initial;
        }

        /* PLAYER SUPERIOR (CARÁTULA Y TÍTULO) */
        .player-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 22px; padding: 25px; width: 350px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(116, 0, 184, 0.2); margin-bottom: 25px; }
        .cover-container { width: 100%; height: 280px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); margin-bottom: 20px; background-color: #151522; display: flex; justify-content: center; align-items: center; }
        .cover-container img { width: 100%; height: 100%; object-fit: cover; }
        .track-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 0.95rem; color: #ffb703; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* NUEVA SECCIÓN: HISTORIAL DE ÚLTIMAS CANCIONES A LO ANCHO */
        .history-section {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .history-section h3 {
            font-size: 1.1rem;
            color: #05ffa1;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 0 0 15px rgba(5, 255, 161, 0.25);
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .history-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(5, 255, 161, 0.3);
        }
        .history-song {
            color: #fff;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-time {
            color: #05ffa1;
            font-size: 0.8rem;
            font-weight: bold;
            flex-shrink: 0;
            margin-left: 15px;
        }

        /* SECCIÓN PROGRAMACIÓN */
        .schedule-section { width: 100%; max-width: 1200px; text-align: center; overflow: hidden; position: relative; margin-bottom: 35px; }
        .schedule-section h2 { font-size: 1.5rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1.5px; color: #05ffa1; text-shadow: 0 0 20px rgba(5, 255, 161, 0.35); }
        
        /* CONTENEDOR MARQUEE (DESLIZAMIENTO INFINITO) */
        .marquee-wrapper {
            display: flex;
            width: 100%;
            overflow: hidden;
            mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
        }

        #schedule-container {
            display: flex;
            gap: 25px;
            width: max-content;
            animation: slideLeft 25s linear infinite;
        }

        .marquee-wrapper:hover #schedule-container {
            animation-play-state: paused;
        }

        @keyframes slideLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* BLOQUE POR DÍA */
        .day-group { 
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px;
            flex-shrink: 0;
            text-align: left;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .day-title { color: #ff2a6d; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        .day-grid { 
            display: flex; 
            flex-direction: row; 
            gap: 12px; 
        }

        .dj-card { 
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; 
            padding: 10px; 
            text-align: center; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 170px;
            height: 170px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .dj-card:hover { transform: translateY(-5px); border-color: #ff2a6d; box-shadow: 0 12px 30px rgba(255, 42, 109, 0.3); }
        
        .dj-img-wrapper {
            width: 100%;
            height: 56%;
            border-radius: 10px;
            overflow: hidden;
            background: #151522;
        }
        .dj-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .dj-info {
            height: 42%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .dj-name { font-size: 0.85rem; font-weight: bold; margin-bottom: 2px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .dj-time { font-size: 0.75rem; color: #05ffa1; }

        .card-actions { display: flex; gap: 4px; justify-content: center; margin-top: 3px; }

        /* SECCIÓN CLIMA DE CHILE A LO ANCHO */
        .weather-section {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            margin-bottom: 35px;
        }
        .weather-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #05ffa1;
            text-shadow: 0 0 20px rgba(5, 255, 161, 0.35);
        }
        .weather-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            justify-content: flex-start;
        }
        .weather-container::-webkit-scrollbar { height: 6px; }
        .weather-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        .city-weather-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 22px;
            min-width: 160px;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .city-weather-card:hover { transform: translateY(-4px); border-color: #05ffa1; box-shadow: 0 12px 30px rgba(5, 255, 161, 0.25); }
        .city-name { font-size: 0.95rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .city-icon { font-size: 2rem; margin: 5px 0; }
        .city-temp { font-size: 1.4rem; font-weight: bold; color: #ff2a6d; }
        .city-cond { font-size: 0.75rem; color: #05ffa1; margin-top: 3px; }

        /* SECCIÓN NOTICIAS DE CHILE CON MOVIMIENTO INFINITO */
        .news-section {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            overflow: hidden;
            position: relative;
            margin-bottom: 35px;
        }
        .news-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #05ffa1;
            text-shadow: 0 0 20px rgba(5, 255, 161, 0.35);
        }

        #news-container {
            display: flex;
            gap: 20px;
            width: max-content;
            animation: slideLeftNews 35s linear infinite;
        }

        .news-section .marquee-wrapper:hover #news-container {
            animation-play-state: paused;
        }

        @keyframes slideLeftNews {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .news-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 310px;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .news-card:hover { transform: translateY(-5px); border-color: #05ffa1; box-shadow: 0 12px 30px rgba(5, 255, 161, 0.25); }
        .news-source {
            font-size: 0.75rem;
            color: #ff2a6d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .news-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .news-link {
            font-size: 0.8rem;
            color: #05ffa1;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }
        .news-link:hover { color: #ff2a6d; }

        /* REPRODUCTOR INCRUSTADO TRANSPARENTE ABAJO */
        .player-footer-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            background: rgba(18, 4, 40, 0.9);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 -8px 25px rgba(0,0,0,0.7);
        }
        #extassisnetwork {
            width: 100%;
            height: auto;
        }

        /* BOTONES */
        .admin-bar { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
        .btn { background: linear-gradient(135deg, #ff2a6d, #7b2cbf); color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.2s; box-shadow: 0 4px 15px rgba(255, 42, 109, 0.4); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 42, 109, 0.6); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); box-shadow: none; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); box-shadow: none; }
        .btn-danger { background: linear-gradient(135deg, #ff4757, #c50222); box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); }
        .btn-danger:hover { box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6); }
        
        /* MODALES */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1a0b2e; padding: 30px; border-radius: 20px; width: 340px; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .modal-content h3 { margin-bottom: 15px; text-align: center; color: #05ffa1; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: #261142; color: #fff; }

        /* Ajustes responsivos para celulares */
        @media (max-width: 480px) {
            .radio-main-title { font-size: 1.8rem; letter-spacing: -0.5px; }
            .radio-main-title span { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- TÍTULO PRINCIPAL MODERNO Y GIGANTE ARRIBA DE TODO -->
    <div class="radio-main-title">
        <span>✨</span> Radio Magia y Poesía <span>🎶</span>
    </div>

    <!-- REPRODUCTOR SUPERIOR (CARÁTULA Y TÍTULO) -->
    <div class="player-card">
        <div class="cover-container">
            <img id="cover" src="https://i.postimg.cc/TPhJq0nf/fondo.png" alt="Carátula / Logo">
        </div>
        <div class="track-info">
            <div class="track-title" id="title">Conectando...</div>
            <div class="track-artist" id="artist">Radio En Vivo</div>
        </div>
    </div>

    <!-- CUADRO A LO ANCHO: ÚLTIMAS 5 CANCIONES REPRODUCIDAS -->
    <div class="history-section">
        <h3>🎵 Últimas Canciones Tocadas</h3>
        <div class="history-list" id="history-container">
            <div class="history-item"><span class="history-song">Cargando historial...</span><span class="history-time">--:--</span></div>
        </div>
    </div>

    <div class="schedule-section">
        <h2>Programación Semanal</h2>
        <div class="marquee-wrapper">
            <div id="schedule-container"></div>
        </div>
        
        <div class="admin-bar">
            <button class="btn" id="auth-btn" onclick="openLoginModal()">Acceso Administrador</button>
            <button class="btn btn-secondary" id="add-btn" style="display: none;" onclick="openAddModal()">+ Agregar Horario</button>
        </div>
    </div>

    <!-- SECCIÓN CLIMA DE CIUDADES DE CHILE -->
    <div class="weather-section">
        <h2>El Tiempo en Chile</h2>
        <div class="weather-container" id="cities-weather-container"></div>
    </div>

    <!-- SECCIÓN NOTICIAS DE CHILE CON EFECTO MARQUESINA -->
    <div class="news-section">
        <h2>Actualidad y Noticias de Chile</h2>
        <div class="marquee-wrapper">
            <div id="news-container"></div>
        </div>
    </div>

    <!-- REPRODUCTOR INCRUSTADO ABAJO A LO ANCHO -->
    <div class="player-footer-container">
        <div id="extassisnetwork"></div>
    </div>

    <!-- Modal Login -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <h3>Iniciar Sesión</h3>
            <input type="text" id="login-username" placeholder="Nombre de usuario">
            <input type="password" id="login-password" placeholder="Contraseña">
            <button class="btn" style="width: 100%;" onclick="loginWithUsername()">Ingresar</button>
            <button class="btn btn-secondary" style="width: 100%; margin-top: 5px;" onclick="closeModal('login-modal')">Cancelar</button>
        </div>
    </div>

    <!-- Modal Guardar/Editar -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h3 id="modal-title">Editar Horario</h3>
            <input type="hidden" id="edit-id">
            <select id="edit-day">
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sábado">Sábado</option>
                <option value="Domingo">Domingo</option>
                <option value="Comodin">Comodin</option>
            </select>
            <input type="text" id="edit-dj" placeholder="Nombre del DJ">
            <input type="text" id="edit-time" placeholder="Horario (ej: 20:00 a 22:00 hrs)">
            <input type="text" id="edit-image" placeholder="URL de la imagen">
            <input type="number" id="edit-order" placeholder="Orden (ej: 1, 2, 3)">
            <button class="btn" style="width: 100%;" onclick="saveDJ()">Guardar</button>
            <button class="btn btn-secondary" style="width: 100%; margin-top: 5px;" onclick="closeModal('edit-modal')">Cancelar</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hguwdsisstrinnbuolat.supabase.co";
        const SUPABASE_KEY = "sb_publishable_gGN6jpvp1wxILud5tbDSQw_cSrnomjJ";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const config = {
            server: "https://streaming.viphosting.cl:8236",
            streamId: "1",
            defaultCover: "https://i.postimg.cc/TPhJq0nf/fondo.png"
        };

        let isAdmin = false;
        let songHistory = [];

        async function loadSchedule() {
            const { data, error } = await _supabase.from('schedule').select('*').order('order_num', { ascending: true });
            if (error) return console.error("Error al cargar la programación:", error);

            const container = document.getElementById('schedule-container');
            container.innerHTML = '';

            const groupedByDay = {};
            data.forEach(item => {
                if (!groupedByDay[item.day_name]) {
                    groupedByDay[item.day_name] = [];
                }
                groupedByDay[item.day_name].push(item);
            });

            const weekDays = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo", "Comodin"];

            const renderDays = () => {
                let htmlContent = '';
                weekDays.forEach(day => {
                    if (groupedByDay[day] && groupedByDay[day].length > 0) {
                        htmlContent += `<div class="day-group"><div class="day-title">${day}</div><div class="day-grid">`;
                        groupedByDay[day].forEach(item => {
                            htmlContent += `
                                <div class="dj-card">
                                    <div class="dj-img-wrapper">
                                        <img src="${item.image_url || 'https://via.placeholder.com/300'}" alt="${item.dj_name}">
                                    </div>
                                    <div class="dj-info">
                                        <div class="dj-name">${item.dj_name}</div>
                                        <div class="dj-time">${item.time_slot}</div>
                                        ${isAdmin ? `
                                            <div class="card-actions">
                                                <button class="btn" style="padding: 2px 6px; font-size: 0.65rem;" onclick="openEditModal(${item.id}, '${item.day_name}', '${item.dj_name}', '${item.time_slot}', '${item.image_url}','${item.ord_num}', ${item.comodin_name})">Editar</button>
                                                <button class="btn btn-danger" style="padding: 2px 6px; font-size: 0.65rem;" onclick="deleteDJ(${item.id})">Eliminar</button>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                        });
                        htmlContent += `</div></div>`;
                    }
                });
                return htmlContent;
            };

            container.innerHTML = renderDays() + renderDays();
        }

        async function loginWithUsername() {
            const usernameInput = document.getElementById('login-username').value;
            const passwordInput = document.getElementById('login-password').value;

            const { data, error } = await _supabase
                .from('admin_users')
                .select('*')
                .eq('username', usernameInput)
                .eq('password', passwordInput);

            if (error || !data || data.length === 0) {
                alert("Usuario o contraseña incorrectos.");
            } else {
                isAdmin = true;
                document.getElementById('auth-btn').innerText = "Cerrar Sesión";
                document.getElementById('auth-btn').onclick = logout;
                document.getElementById('add-btn').style.display = "inline-block";
                closeModal('login-modal');
                loadSchedule();
            }
        }

        function logout() {
            isAdmin = false;
            document.getElementById('auth-btn').innerText = "Acceso Administrador";
            document.getElementById('auth-btn').onclick = openLoginModal;
            document.getElementById('add-btn').style.display = "none";
            loadSchedule();
        }

        function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
        
        function openAddModal() {
            document.getElementById('modal-title').innerText = "Agregar Horario";
            document.getElementById('edit-id').value = "";
            document.getElementById('edit-dj').value = "";
            document.getElementById('edit-time').value = "";
            document.getElementById('edit-image').value = "";
            document.getElementById('edit-order').value = "1";
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function openEditModal(id, day, dj, time, image, order) {
            document.getElementById('modal-title').innerText = "Editar Horario";
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-day').value = day;
            document.getElementById('edit-dj').value = dj;
            document.getElementById('edit-time').value = time;
            document.getElementById('edit-image').value = image;
            document.getElementById('edit-order').value = order;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function saveDJ() {
            const id = document.getElementById('edit-id').value;
            const day_name = document.getElementById('edit-day').value;
            const dj_name = document.getElementById('edit-dj').value;
            const time_slot = document.getElementById('edit-time').value;
            const image_url = document.getElementById('edit-image').value;
            const order_num = parseInt(document.getElementById('edit-order').value) || 1;

            let error;
            if (id) {
                ({ error } = await _supabase.from('schedule').update({ day_name, dj_name, time_slot, image_url, order_num }).eq('id', id));
            } else {
                ({ error } = await _supabase.from('schedule').insert([{ day_name, dj_name, time_slot, image_url, order_num }]));
            }

            if (error) {
                alert("Error al guardar: " + error.message);
            } else {
                closeModal('edit-modal');
                loadSchedule();
            }
        }

        async function deleteDJ(id) {
            if (confirm("¿Seguro que deseas eliminar este horario?")) {
                const { error } = await _supabase.from('schedule').delete().eq('id', id);
                if (error) alert("Error al eliminar: " + error.message);
                else loadSchedule();
            }
        }

        /* METADATOS, CARÁTULA E HISTORIAL DE CANCIONES */
        function fetchShoutcastData() {
            const script = document.createElement('script');
            script.src = `${config.server}/stats?sid=${config.streamId}&json=1&callback=parseShoutcastData&ts=${new Date().getTime()}`;
            document.body.appendChild(script);
            setTimeout(() => script.remove(), 2500);
        }

        window.parseShoutcastData = function(data) {
            if (data && data.songtitle) {
                let artist = "Radio En Vivo", song = data.songtitle;
                if (data.songtitle.includes(" - ")) {
                    const parts = data.songtitle.split(" - ");
                    artist = parts[0].trim(); song = parts.slice(1).join(" - ").trim();
                }
                document.getElementById('artist').innerText = artist;
                document.getElementById('title').innerText = song;
                fetchiTunesCover(artist, song);

                // Gestionar historial de últimas 5 canciones
                const fullSongString = `${artist} - ${song}`;
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                if (songHistory.length === 0 || songHistory[0].title !== fullSongString) {
                    // Evitar duplicados consecutivos si ya es la actual
                    songHistory.unshift({ title: fullSongString, time: timeString });
                    if (songHistory.length > 5) {
                        songHistory.pop();
                    }
                    updateHistoryUI();
                }
            }
        };

        function updateHistoryUI() {
            const container = document.getElementById('history-container');
            container.innerHTML = "";
            songHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <span class="history-song">🎵 ${item.title}</span>
                    <span class="history-time">${item.time}</span>
                `;
                container.appendChild(div);
            });
        }

        function fetchiTunesCover(artist, song) {
            window.itunesCallback = function(data) {
                if (data.results && data.results.length > 0) {
                    document.getElementById('cover').src = data.results[0].artworkUrl100.replace('100x100bb.jpg', '600x600bb.jpg');
                } else {
                    document.getElementById('cover').src = config.defaultCover;
                }
            };
            const script = document.createElement('script');
            script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(artist + " " + song)}&media=music&limit=1&callback=itunesCallback`;
            document.body.appendChild(script);
            setTimeout(() => script.remove(), 2500);
        }

        // CARGAR CLIMA DE CHILE
        async function loadCitiesWeather() {
            const cities = [
                { name: "Santiago", lat: -33.4489, lon: -70.6693 },
                { name: "Concepción", lat: -36.8270, lon: -73.0503 },
                { name: "Valparaíso", lat: -33.0472, lon: -71.6127 },
                { name: "La Serena", lat: -29.9045, lon: -71.2489 },
                { name: "Antofagasta", lat: -23.6509, lon: -70.3975 },
                { name: "Temuco", lat: -38.7359, lon: -72.5904 },
                { name: "Puerto Montt", lat: -41.4693, lon: -72.9424 }
            ];

            const container = document.getElementById('cities-weather-container');
            container.innerHTML = "";

            for (const city of cities) {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current_weather=true`);
                    const data = await res.json();
                    
                    if (data && data.current_weather) {
                        const temp = data.current_weather.temperature;
                        const code = data.current_weather.weathercode;
                        
                        let condition = "Despejado";
                        let icon = "☀️";
                        if (code >= 1 && code <= 3) { condition = "Parcial"; icon = "⛅"; }
                        else if (code >= 45 && code <= 48) { condition = "Neblina"; icon = "🌫️"; }
                        else if (code >= 51 && code <= 67) { condition = "Lluvia"; icon = "🌧️"; }
                        else if (code >= 71 && code <= 77) { condition = "Nieve"; icon = "❄️"; }
                        else if (code >= 95) { condition = "Tormenta"; icon = "⚡"; }

                        const card = document.createElement('div');
                        card.className = 'city-weather-card';
                        card.innerHTML = `
                            <div class="city-name">${city.name}</div>
                            <div class="city-icon">${icon}</div>
                            <div class="city-temp">${temp}°C</div>
                            <div class="city-cond">${condition}</div>
                        `;
                        container.appendChild(card);
                    }
                } catch (e) {
                    console.error(`Error cargando clima para ${city.name}`);
                }
            }
        }

        // CARGAR NOTICIAS DE CHILE CON EFECTO MARQUESINA (DUPLICADO PARA BUCLE FLUIDO)
        async function loadNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = "";

            const fallbackNews = [
                { title: "Actualidad Nacional: Gobierno anuncia nuevas medidas económicas para regiones", source: "BioBio Chile", link: "https://www.biobiochile.cl" },
                { title: "Reporte Meteorológico: Se pronostican precipitaciones en la zona sur del país", source: "MeteoChile", link: "https://www.meteochile.gob.cl" },
                { title: "Innovación y Tecnología: Startups chilenas lideran inversión en América Latina", source: "Emol Nacional", link: "https://www.emol.com" },
                { title: "Cultura y Espectáculos: Festival de Teatro Urbano convoca masiva asistencia en Santiago", source: "La Tercera", link: "https://www.latercera.com" },
                { title: "Desarrollo Sostenible: Regiones impulsan proyectos masivos de energía limpia", source: "Cooperativa", link: "https://www.cooperativa.cl" }
            ];

            let newsItemsHtml = '';

            try {
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.biobiochile.cl/feed`);
                const data = await response.json();

                if (data && data.items && data.items.length > 0) {
                    data.items.slice(0, 8).forEach(item => {
                        newsItemsHtml += `
                            <div class="news-card">
                                <div>
                                    <div class="news-source">BioBio Chile</div>
                                    <div class="news-title">${item.title}</div>
                                </div>
                                <a href="${item.link}" target="_blank" class="news-link">Leer más &rarr;</a>
                            </div>
                        `;
                    });
                } else {
                    fallbackNews.forEach(news => {
                        newsItemsHtml += `
                            <div class="news-card">
                                <div>
                                    <div class="news-source">${news.source}</div>
                                    <div class="news-title">${news.title}</div>
                                </div>
                                <a href="${news.link}" target="_blank" class="news-link">Leer más &rarr;</a>
                            </div>
                        `;
                    });
                }
            } catch (e) {
                fallbackNews.forEach(news => {
                    newsItemsHtml += `
                        <div class="news-card">
                            <div>
                                <div class="news-source">${news.source}</div>
                                <div class="news-title">${news.title}</div>
                            </div>
                            <a href="${news.link}" target="_blank" class="news-link">Leer más &rarr;</a>
                        </div>
                    `;
                });
            }

            container.innerHTML = newsItemsHtml + newsItemsHtml;
        }

        fetchShoutcastData();
        setInterval(fetchShoutcastData, 5000);
        loadSchedule();
        loadCitiesWeather();
        loadNews();
    </script>
