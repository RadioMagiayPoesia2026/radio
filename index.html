<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radio Magia y Poesía</title>

  <!-- Carga de scripts -->
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://extassisnetwork.com/player/Luna/luna.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- Fuentes Tipográficas Elegantes y Poéticas -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;700;900&family=Poppins:ital,wght@1,300;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      transition: background-color 0.4s ease;
      background-color: #0f0c20;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Poppins', sans-serif;
    }

    /* Layout Adaptable */
    .main-layout {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 5%;
    }

    /* Título e Íconos a la Izquierda en Pantallas Grandes */
    .radio-brand-container {
      position: absolute;
      left: 5%;
      top: 50%;
      transform: translateY(-50%);
      text-align: left;
      color: #fff;
      max-width: 320px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .radio-brand-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 38px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 12px #00f3ff, 0 0 25px #00f3ff;
      margin: 0 0 5px 0;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .radio-brand-title i {
      color: #00f3ff;
      font-size: 34px;
      filter: drop-shadow(0 0 8px #00f3ff);
    }

    .radio-brand-subtitle {
      font-family: 'Great Vibes', cursive;
      font-size: 45px;
      font-weight: 400;
      color: #ff9ff3;
      text-shadow: 0 0 15px rgba(255, 159, 243, 0.9);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1;
    }

    .radio-brand-subtitle i {
      font-size: 24px;
      color: #ff6b6b;
    }

    /* Galería de Íconos Decorativos */
    .brand-icons-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 14px;
      margin-top: 20px;
      color: #00f3ff;
      font-size: 18px;
    }

    .brand-icons-bar i {
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .brand-icons-bar i:hover {
      transform: scale(1.3) rotate(12deg);
      color: #ff9ff3;
      text-shadow: 0 0 10px #ff9ff3;
    }

    /* Contador de Oyentes Online */
    .listeners-box {
      margin-top: 25px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 10px 18px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .listeners-box i {
      color: #00f3ff;
      font-size: 16px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #ff4757;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #ff4757;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Contenedor del Reproductor Centrado */
    .player-center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      width: 100%;
      max-width: 380px;
    }

    #player-wrapper {
      width: 100%;
      height: 450px;
      border: 3px solid #00f3ff;
      border-radius: 12px;
      box-shadow: 0 0 20px #00f3ff, inset 0 0 10px rgba(0, 243, 255, 0.5);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    #player-wrapper.playing {
      animation: cyanNeonGlow 1.2s infinite alternate ease-in-out;
    }

    @keyframes cyanNeonGlow {
      0% {
        border-color: #00f3ff;
        box-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff, 0 0 45px rgba(0, 243, 255, 0.6);
      }
      50% {
        border-color: #80f8ff;
        box-shadow: 0 0 25px #00f3ff, 0 0 50px #00f3ff, 0 0 75px #00f3ff, inset 0 0 15px #00f3ff;
        transform: scale(1.015);
      }
      100% {
        border-color: #00f3ff;
        box-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff, 0 0 45px rgba(0, 243, 255, 0.6);
      }
    }

    /* Botones de Acción */
    .action-buttons-container {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .icon-open-btn {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 2px solid #333;
      padding: 14px 18px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(5px);
    }

    .icon-open-btn:hover {
      background: #00f3ff;
      color: #000;
      border-color: #ffffff;
      transform: translateY(-6px) scale(1.1);
      box-shadow: 0 10px 20px rgba(0, 243, 255, 0.6);
    }

    /* Caja del DJ Online */
    .dj-online-box {
      margin-top: 15px;
      background: rgba(15, 12, 32, 0.85);
      border: 1px solid rgba(255, 159, 243, 0.5);
      padding: 10px 20px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(255, 159, 243, 0.25);
      backdrop-filter: blur(5px);
      text-align: center;
    }

    .dj-online-box i {
      color: #ff9ff3;
      font-size: 18px;
    }

    .dj-name {
      color: #00f3ff;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }

    /* Cuadro Derecho: Últimas Canciones Sonadas */
    .recent-tracks-container {
      position: absolute;
      right: 5%;
      top: 50%;
      transform: translateY(-50%);
      width: 300px;
      background: rgba(15, 12, 32, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 16px;
      padding: 18px;
      color: #fff;
      z-index: 10;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
    }

    .recent-tracks-header {
      font-size: 15px;
      font-weight: 700;
      color: #00f3ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      padding-bottom: 8px;
    }

    .recent-tracks-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .recent-track-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid #ff9ff3;
      font-size: 12px;
      transition: transform 0.2s;
    }

    .recent-track-item:first-child {
      border-left-color: #00f3ff;
      background: rgba(0, 243, 255, 0.1);
    }

    .recent-track-item i {
      color: #ff9ff3;
      font-size: 14px;
    }

    .recent-track-item:first-child i {
      color: #00f3ff;
    }

    .recent-track-info {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      width: 100%;
    }

    .recent-track-title {
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-track-status {
      font-size: 10px;
      color: #aaa;
      display: block;
    }

    /* Menús Laterales (Sidebar) */
    .sidebar {
      height: 100%;
      width: 0;
      position: fixed;
      z-index: 1000;
      top: 0;
      right: 0;
      left: auto;
      background-color: #111;
      overflow-x: hidden;
      overflow-y: auto;
      transition: width 0.3s ease;
      padding-top: 60px;
      color: #fff;
    }

    .sidebar .close-btn {
      position: absolute;
      top: 15px;
      left: 25px;
      font-size: 28px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
    }

    .sidebar-content {
      padding: 0 20px 40px 20px;
      position: relative;
    }

    .schedule-list {
      list-style: none;
      padding: 0;
    }

    .schedule-list li {
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }

    .schedule-list span {
      color: #00f3ff;
      font-weight: bold;
    }

    .admin-accordion {
      margin-bottom: 20px;
      border-bottom: 2px solid #444;
      padding-bottom: 15px;
      position: relative;
    }

    .admin-toggle-btn {
      background: transparent;
      color: #fff;
      border: none;
      width: 100%;
      padding: 5px 0;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .admin-toggle-btn i {
      font-size: 22px;
    }

    .admin-dropdown-content {
      display: none;
      position: fixed;
      top: 70px;
      right: 300px;
      left: auto;
      width: 250px;
      background-color: #1a1a1a;
      border: 1px solid #444;
      padding: 15px;
      box-shadow: -5px 5px 15px rgba(0,0,0,0.7);
      z-index: 1005;
      border-radius: 8px;
    }

    .admin-input, .comment-input, .chat-input {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-family: inherit;
    }

    .edit-field {
      width: 100%;
      padding: 6px;
      margin: 3px 0;
      background: #1e1e1e;
      border: 1px solid #00f3ff;
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
    }

    .btn-action {
      background: #00f3ff;
      color: #000;
      border: none;
      padding: 10px 12px;
      cursor: pointer;
      margin-top: 8px;
      border-radius: 4px;
      width: 100%;
      font-weight: bold;
    }

    .comments-list, .chat-list {
      list-style: none;
      padding: 0;
      max-height: 50vh;
      overflow-y: auto;
    }

    .comments-list li, .chat-list li {
      padding: 10px;
      background: #1e1e1e;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .comments-list strong, .chat-list strong {
      color: #00f3ff;
      display: block;
      margin-bottom: 3px;
    }

    .comment-date, .chat-date {
      font-size: 10px;
      color: #888;
      float: right;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .color-box {
      width: 100%;
      height: 45px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }

    /* Media Queries */
    @media (max-width: 1100px) {
      .main-layout {
        flex-direction: column;
        justify-content: flex-start;
        padding: 30px 15px 40px 15px;
        gap: 20px;
        min-height: auto;
      }

      .radio-brand-container {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        text-align: center;
        align-items: center;
        max-width: 100%;
      }

      .recent-tracks-container {
        position: relative;
        right: auto;
        top: auto;
        transform: none;
        width: 100%;
        max-width: 380px;
        margin-top: 10px;
      }

      .radio-brand-title {
        font-size: 26px;
        justify-content: center;
      }

      .radio-brand-title i {
        font-size: 26px;
      }

      .radio-brand-subtitle {
        font-size: 34px;
        justify-content: center;
      }

      .radio-brand-subtitle i {
        font-size: 20px;
      }

      .brand-icons-bar {
        justify-content: center;
        font-size: 18px;
        gap: 16px;
        margin-top: 15px;
      }

      .listeners-box {
        margin-top: 18px;
        padding: 8px 16px;
        font-size: 13px;
      }

      .player-center-container {
        max-width: 100%;
      }

      #player-wrapper {
        height: 420px;
        max-height: 60vh;
      }

      .action-buttons-container {
        margin-top: 15px;
        gap: 12px;
      }

      .icon-open-btn {
        padding: 12px 16px;
        font-size: 18px;
      }

      .sidebar.open-mobile {
        width: 100% !important;
      }

      .admin-dropdown-content {
        position: relative;
        top: 0;
        right: 0;
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .radio-brand-title {
        font-size: 22px;
      }

      .radio-brand-subtitle {
        font-size: 28px;
      }

      #player-wrapper {
        height: 380px;
      }
    }
  </style>
</head>
<body>

<!-- Sidebar Horarios -->
<div id="mySidebar" class="sidebar">
  <a href="javascript:void(0)" class="close-btn" onclick="toggleNav()">&times;</a>
  <div class="sidebar-content">
    <div class="admin-accordion">
      <button class="admin-toggle-btn" onclick="toggleAdminMenu()">
        <i class="fa-solid fa-user-gear"></i>
        <span>Administrador</span>
      </button>
      <div id="admin-dropdown" class="admin-dropdown-content">
        <div id="login-form">
          <input type="text" id="admin-user" class="admin-input" placeholder="Usuario"><br>
          <input type="password" id="admin-pass" class="admin-input" placeholder="Contraseña"><br>
          <button class="btn-action" onclick="loginAdmin()">Ingresar</button>
        </div>
        <div id="admin-controls" style="display:none;">
          <p style="color: #00f3ff; font-size: 13px;"><i class="fa-solid fa-check"></i> Modo Edición Activado</p>
          <button class="btn-action" style="background:#00f3ff; color:#000;" onclick="saveSchedules()">
            <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
          </button>
          <button class="btn-action" style="background:#555; color:#fff;" onclick="logoutAdmin()">Cerrar Sesión</button>
        </div>
      </div>
    </div>
    <h3><i class="fa-solid fa-headphone"></i> Programación DJs</h3>
    <ul id="schedule-container" class="schedule-list"></ul>
  </div>
</div>

<!-- Sidebar Comentarios -->
<div id="commentsSidebar" class="sidebar">
  <a href="javascript:void(0)" class="close-btn" onclick="toggleComments()">&times;</a>
  <div class="sidebar-content">
    <h3><i class="fa-solid fa-comments"></i> Comentarios</h3>
    <div style="margin-bottom: 20px;">
      <input type="text" id="comment-name" class="comment-input" placeholder="Tu Nombre"><br>
      <textarea id="comment-text" class="comment-input" style="height: 60px;" placeholder="Escribe tu mensaje..."></textarea><br>
      <button class="btn-action" onclick="sendComment()"><i class="fa-solid fa-paper-plane"></i> Enviar Comentario</button>
    </div>
    <ul id="comments-container" class="comments-list"></ul>
  </div>
</div>

<!-- Sidebar Paleta -->
<div id="paletteSidebar" class="sidebar">
  <a href="javascript:void(0)" class="close-btn" onclick="togglePalette()">&times;</a>
  <div class="sidebar-content">
    <h3><i class="fa-solid fa-palette"></i> Colores Vibrantes</h3>
    <div class="color-grid">
      <div class="color-box" style="background-color: #0f0c20;" onclick="changeBgColor('#0f0c20')"></div>
      <div class="color-box" style="background-color: #d63031;" onclick="changeBgColor('#d63031')"></div>
      <div class="color-box" style="background-color: #e84393;" onclick="changeBgColor('#e84393')"></div>
      <div class="color-box" style="background-color: #6c5ce7;" onclick="changeBgColor('#6c5ce7')"></div>
      <div class="color-box" style="background-color: #0984e3;" onclick="changeBgColor('#0984e3')"></div>
      <div class="color-box" style="background-color: #00cec9;" onclick="changeBgColor('#00cec9')"></div>
      <div class="color-box" style="background-color: #00b894;" onclick="changeBgColor('#00b894')"></div>
      <div class="color-box" style="background-color: #10ac84;" onclick="changeBgColor('#10ac84')"></div>
    </div>
  </div>
</div>

<!-- Sidebar Chat -->
<div id="chatSidebar" class="sidebar">
  <a href="javascript:void(0)" class="close-btn" onclick="toggleChat()">&times;</a>
  <div class="sidebar-content">
    <h3><i class="fa-solid fa-message"></i> Chat en Vivo</h3>
    <div style="margin-bottom: 20px;">
      <input type="text" id="chat-user" class="chat-input" placeholder="Tu Apodo/Nombre"><br>
      <textarea id="chat-message" class="chat-input" style="height: 60px;" placeholder="Mensaje rápido..."></textarea><br>
      <button class="btn-action" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i> Enviar Mensaje</button>
    </div>
    <ul id="chat-container" class="chat-list"></ul>
  </div>
</div>

<!-- Contenido Principal -->
<div class="main-layout">
  
  <!-- Título, Íconos Decorativos y Oyentes Online -->
  <div class="radio-brand-container">
    <h1 class="radio-brand-title">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Radio Magia
    </h1>
    <p class="radio-brand-subtitle">
      <i class="fa-solid fa-feather-pointed"></i> y Poesía
    </p>
    <div class="brand-icons-bar">
      <i class="fa-solid fa-music" title="Música"></i>
      <i class="fa-solid fa-star" title="Magia"></i>
      <i class="fa-solid fa-book-open" title="Poesía"></i>
      <i class="fa-solid fa-heart" title="Amor"></i>
      <i class="fa-solid fa-moon" title="Noche"></i>
      <i class="fa-solid fa-compact-disc" title="En vivo"></i>
      <i class="fa-solid fa-volume-high" title="Sonido"></i>
      <i class="fa-solid fa-icons" title="Arte"></i>
    </div>

    <!-- Oyentes Online -->
    <div class="listeners-box">
      <span class="live-dot"></span>
      <i class="fa-solid fa-users"></i>
      <span>Oyentes Online: <strong id="listeners-count" style="color:#00f3ff;">0</strong></span>
    </div>
  </div>

  <!-- Reproductor y Botones de Acción -->
  <div class="player-center-container">
    <div id="player-wrapper">
      <div id="extassisnetwork" style="width: 100%; height: 100%;"></div>
    </div>
    
    <div class="action-buttons-container">
      <button class="icon-open-btn" onclick="toggleNav()" title="Horarios DJ">
        <i class="fa-solid fa-calendar-days"></i>
      </button>
      <button class="icon-open-btn" onclick="toggleComments()" title="Comentarios">
        <i class="fa-solid fa-comments"></i>
      </button>
      <button class="icon-open-btn" onclick="togglePalette()" title="Paleta de Colores">
        <i class="fa-solid fa-palette"></i>
      </button>
      <button class="icon-open-btn" onclick="toggleChat()" title="Chat en Vivo">
        <i class="fa-solid fa-message"></i>
      </button>
    </div>

    <!-- DJ Online al aire -->
    <div class="dj-online-box">
      <i class="fa-solid fa-headset"></i>
      <span>DJ al Aire: <span id="current-dj-name" class="dj-name">Cargando...</span></span>
    </div>
  </div>

  <!-- Cuadro Derecho: Últimos 3 Temas Sonados -->
  <div class="recent-tracks-container">
    <div class="recent-tracks-header">
      <i class="fa-solid fa-compact-disc fa-spin"></i>
      <span>Últimos 3 Temas</span>
    </div>
    <ul id="recent-tracks-list" class="recent-tracks-list">
      <li class="recent-track-item">
        <i class="fa-solid fa-music"></i>
        <div class="recent-track-info">
          <span class="recent-track-status">Cargando canciones...</span>
        </div>
      </li>
    </ul>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://wvnfuvmfjlhdkyxdsazp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1gY06mLg_OIdWwkvL7ZEHA_GLBk0XLa';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let defaultSchedules = [

    { id: 2, dia: 'Lunes', dj: 'Margaret Dj', horario: '22:00 - 00:00' },
    { id: 3, dia: 'Martes', dj: 'Andrea Dj', horario: '22:00 - 00:00' },
    { id: 4, dia: 'Miércoles', dj: 'Margaret Dj', horario: '22:00 - 00:00' },
    { id: 5, dia: 'Jueves', dj: 'Halcon Negro', horario: '22:00 - 00:00' },
    { id: 6, dia: 'Viernes', dj: 'La Bruja Dj', horario: '22:00 - 00:00' },
    { id: 7, dia: 'Sábado', dj: 'Plagio Dj', horario: '22:00 - 00:00' },
    { id: 8, dia: 'Domingo', dj: 'BaRT', horario: '22:00 - 00:00' },
    { id: 9, dia: 'Comodines', dj: 'Ruby Dj / Mister-xDj', horario: 'Rotativo' }
  ];

  let isAdmin = false;
  let currentData = [];

  function changeBgColor(color) {
    document.body.style.backgroundColor = color;
  }

  function openSidebar(id) {
    closeOtherMenus(id);
    const sidebar = document.getElementById(id);
    const isMobile = window.innerWidth <= 1100;
    
    if (sidebar.style.width === "300px" || sidebar.classList.contains("open-mobile")) {
      sidebar.style.width = "0";
      sidebar.classList.remove("open-mobile");
      if (id === "mySidebar") document.getElementById("admin-dropdown").style.display = "none";
    } else {
      if (isMobile) {
        sidebar.classList.add("open-mobile");
      } else {
        sidebar.style.width = "300px";
      }
    }
  }

  function toggleNav() { openSidebar("mySidebar"); }
  function toggleComments() { openSidebar("commentsSidebar"); if (document.getElementById("commentsSidebar").style.width !== "0px" || document.getElementById("commentsSidebar").classList.contains("open-mobile")) loadComments(); }
  function togglePalette() { openSidebar("paletteSidebar"); }
  function toggleChat() { openSidebar("chatSidebar"); if (document.getElementById("chatSidebar").style.width !== "0px" || document.getElementById("chatSidebar").classList.contains("open-mobile")) loadChatMessages(); }

  function closeOtherMenus(current) {
    ["mySidebar", "commentsSidebar", "paletteSidebar", "chatSidebar"].forEach(m => {
      if (m !== current) {
        const el = document.getElementById(m);
        el.style.width = "0";
        el.classList.remove("open-mobile");
      }
    });
    if (current !== "mySidebar") document.getElementById("admin-dropdown").style.display = "none";
  }

  function toggleAdminMenu() {
    const dropdown = document.getElementById("admin-dropdown");
    dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
  }

  async function loadSchedules() {
    let { data: horarios, error } = await _supabase.from('horarios_dj').select('*').order('id', { ascending: true });
    currentData = (error || !horarios || horarios.length === 0) ? defaultSchedules : horarios;
    renderSchedules(currentData);
    checkCurrentDJ(currentData);
  }

  function renderSchedules(data) {
    const container = document.getElementById('schedule-container');
    container.innerHTML = '';
    data.forEach(item => {
      if (isAdmin) {
        container.innerHTML += `
          <li>
            <label style="font-size: 11px; color: #888;">Día:</label>
            <input type="text" class="edit-field edit-dia" data-id="${item.id}" value="${item.dia}">
            <label style="font-size: 11px; color: #888;">DJ:</label>
            <input type="text" class="edit-field edit-dj" data-id="${item.id}" value="${item.dj}">
            <label style="font-size: 11px; color: #888;">Horario:</label>
            <input type="text" class="edit-field edit-horario" data-id="${item.id}" value="${item.horario}">
          </li>`;
      } else {
        container.innerHTML += `
          <li>
            <span>${item.dia}:</span> ${item.dj}<br>
            <small><i class="fa-regular fa-clock"></i> ${item.horario}</small>
          </li>`;
      }
    });
  }

  /* Determina el DJ que está al aire actualmente según hora/día */
  function checkCurrentDJ(schedules) {
    const now = new Date();
    const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const currentDay = days[now.getDay()];
    const currentMinutes = now.getHours() * 60 + now.getMinutes();

    let activeDJ = "AutoDJ / Música Continuada";

    schedules.forEach(item => {
      const matchDay = item.dia.toLowerCase().includes(currentDay.toLowerCase()) || item.dia.toLowerCase().includes('lunes a domingo');
      if (matchDay && item.horario.includes('-')) {
        const parts = item.horario.split('-');
        const startParts = parts[0].trim().split(':');
        const endParts = parts[1].trim().split(':');

        if (startParts.length === 2 && endParts.length === 2) {
          let startMin = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
          let endMin = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);

          if (endMin === 0) endMin = 24 * 60; // Trata las 00:00 como medianoche

          if (startMin < endMin) {
            if (currentMinutes >= startMin && currentMinutes < endMin) {
              activeDJ = item.dj;
            }
          } else {
            // Caso donde cruza la medianoche (ej: 22:00 - 02:00)
            if (currentMinutes >= startMin || currentMinutes < endMin) {
              activeDJ = item.dj;
            }
          }
        }
      }
    });

    document.getElementById('current-dj-name').innerText = activeDJ;
  }

  async function loginAdmin() {
    const user = document.getElementById('admin-user').value;
    const pass = document.getElementById('admin-pass').value;
    const { data } = await _supabase.from('administradores').select('*').eq('username', user).eq('password_hash', pass).single();

    if (data) {
      isAdmin = true;
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('admin-controls').style.display = 'block';
      renderSchedules(currentData);
    } else {
      alert('Credenciales incorrectas');
    }
  }

  function logoutAdmin() {
    isAdmin = false;
    document.getElementById('login-form').style.display = 'block';
    document.getElementById('admin-controls').style.display = 'none';
    renderSchedules(currentData);
  }

  async function saveSchedules() {
    const dias = document.querySelectorAll('.edit-dia');
    const djs = document.querySelectorAll('.edit-dj');
    const horarios = document.querySelectorAll('.edit-horario');

    for (let i = 0; i < dias.length; i++) {
      const id = dias[i].dataset.id;
      await _supabase.from('horarios_dj').upsert({
        id: parseInt(id),
        dia: dias[i].value,
        dj: djs[i].value,
        horario: horarios[i].value
      });
    }
    alert('¡Horarios actualizados con éxito!');
    loadSchedules();
  }

  async function loadComments() {
    const { data: comentarios } = await _supabase.from('comentarios').select('*').order('created_at', { ascending: false });
    const container = document.getElementById('comments-container');
    container.innerHTML = comentarios && comentarios.length ? '' : '<li>Aún no hay comentarios.</li>';
    if (comentarios) {
      comentarios.forEach(c => {
        const fecha = new Date(c.created_at).toLocaleDateString('es-ES', { hour: '2-digit', minute: '2-digit' });
        container.innerHTML += `
          <li>
            <span class="comment-date">${fecha}</span>
            <strong>${escapeHtml(c.nombre)}</strong>
            <div>${escapeHtml(c.mensaje)}</div>
          </li>`;
      });
    }
  }

  async function sendComment() {
    const nombre = document.getElementById('comment-name').value.trim();
    const mensaje = document.getElementById('comment-text').value.trim();
    if (!nombre || !mensaje) return alert('Completa todos los campos.');
    const { error } = await _supabase.from('comentarios').insert([{ nombre, mensaje }]);
    if (!error) {
      document.getElementById('comment-text').value = '';
      loadComments();
    }
  }

  async function loadChatMessages() {
    const { data: chatMsgs } = await _supabase.from('chat_envivo').select('*').order('created_at', { ascending: false }).limit(30);
    const container = document.getElementById('chat-container');
    container.innerHTML = chatMsgs && chatMsgs.length ? '' : '<li>¡Inicia la conversación!</li>';
    if (chatMsgs) {
      chatMsgs.forEach(m => {
        const fecha = new Date(m.created_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        container.innerHTML += `
          <li>
            <span class="chat-date">${fecha}</span>
            <strong>${escapeHtml(m.usuario)}</strong>
            <div>${escapeHtml(m.mensaje)}</div>
          </li>`;
      });
    }
  }

  async function sendChatMessage() {
    const usuario = document.getElementById('chat-user').value.trim();
    const mensaje = document.getElementById('chat-message').value.trim();
    if (!usuario || !mensaje) return alert('Ingresa tu apodo y mensaje.');
    const { error } = await _supabase.from('chat_envivo').insert([{ usuario, mensaje }]);
    if (!error) {
      document.getElementById('chat-message').value = '';
      loadChatMessages();
    }
  }

  function fetchListenersAndTracks() {
    $.ajax({
      url: "https://streaming.viphosting.cl:8236/stats?json=1",
      dataType: "jsonp",
      success: function(data) {
        if (data) {
          if (data.currentlisteners !== undefined) {
            $("#listeners-count").text(data.currentlisteners);
          }

          // Obtener últimas 3 canciones
          let songs = [];
          if (data.songhistory && data.songhistory.length > 0) {
            songs = data.songhistory.slice(0, 3).map(s => s.title);
          } else if (data.songtitle) {
            songs = [data.songtitle];
          }

          renderRecentTracks(songs);
        }
      },
      error: function() {
        $("#listeners-count").text("En Vivo");
      }
    });
  }

  function renderRecentTracks(songs) {
    const list = $("#recent-tracks-list");
    list.empty();

    if (!songs || songs.length === 0) {
      list.append(`
        <li class="recent-track-item">
          <i class="fa-solid fa-music"></i>
          <div class="recent-track-info">
            <span class="recent-track-title">Sin información</span>
          </div>
        </li>
      `);
      return;
    }

    songs.forEach((song, index) => {
      const statusText = index === 0 ? "Sonando ahora" : "Anterior";
      const iconClass = index === 0 ? "fa-solid fa-compact-disc fa-spin" : "fa-solid fa-music";
      
      list.append(`
        <li class="recent-track-item">
          <i class="${iconClass}"></i>
          <div class="recent-track-info">
            <span class="recent-track-status">${statusText}</span>
            <div class="recent-track-title" title="${escapeHtml(song)}">${escapeHtml(song)}</div>
          </div>
        </li>
      `);
    });
  }

  function escapeHtml(text) {
    return text ? text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : '';
  }

  $(document).ready(function() {
    loadSchedules();
    fetchListenersAndTracks();
    setInterval(fetchListenersAndTracks, 10000);
    setInterval(function() { checkCurrentDJ(currentData); }, 60000);

    $("#extassisnetwork").lunaradio({
      streamurl: "https://streaming.viphosting.cl:8236",
      radioname: "RADIO MAGIA Y POESIA",
      coverimage: "https://i.postimg.cc/TPhJq0nf/fondo.png",
      onlycoverimage: false,
      userinterface: "big",
      backgroundcolor: "#0a0a0a",
      fontcolor: "#ffffff",
      hightlightcolor: "#00f3ff",
      fontname: "Be Vietnam",
      googlefont: "Be Vietnam",
      fontratio: "0.4",
      scroll: "true",
      coverstyle: "animated",
      usevisualizer: "real",
      visualizertype: "6",
      streamtype: "shoutcast2",
      shoutcastpath: "/stream",
      shoutcastid: "1",
      metadatainterval: "5000",
      volume: "100",
      usestreamcorsproxy: "true",
    });

    $(document).on("click", "#extassisnetwork", function() {
      setTimeout(function() {
        if ($("#extassisnetwork").hasClass("luna-playing") || $(".luna-btn-play").hasClass("luna-pause")) {
          $("#player-wrapper").addClass("playing");
        } else {
          $("#player-wrapper").removeClass("playing");
        }
      }, 300);
    });
  });
</script>
